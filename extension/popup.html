<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Well-Charged Blocker</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      width: 320px;
      min-height: 400px;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white p-4">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center space-x-2">
      <img src="icons/icon48.png" alt="Well-Charged Logo" class="w-8 h-8">
      <h1 class="text-lg font-bold">Well-Charged</h1>
    </div>
    <div class="flex items-center">
      <label for="blocking-toggle" class="relative inline-flex items-center cursor-pointer">
        <input 
          type="checkbox" 
          id="blocking-toggle" 
          name="blocking-toggle"
          class="sr-only peer" 
          aria-label="Enable blocking"
          title="Toggle blocking"
        >
        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
        <span class="sr-only">Enable blocking</span>
      </label>
    </div>
  </div>

  <div class="space-y-4">
    <!-- Stats -->
    <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm">
      <h2 class="text-sm font-semibold mb-3">Today's Stats</h2>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <p class="text-xs text-gray-500 dark:text-gray-400">Distractions Blocked</p>
          <p class="text-lg font-bold" id="distractions-count">0</p>
        </div>
        <div>
          <p class="text-xs text-gray-500 dark:text-gray-400">Ads Blocked</p>
          <p class="text-lg font-bold" id="ads-count">0</p>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm">
      <h2 class="text-sm font-semibold mb-3">Quick Actions</h2>
      <div class="space-y-2">
        <button id="focus-mode" class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">
          Start Focus Mode
        </button>
        <button id="break-time" class="w-full px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-medium transition-colors">
          Take a Break
        </button>
      </div>
    </div>

    <!-- Current Schedule -->
    <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm">
      <h2 class="text-sm font-semibold mb-3">Active Schedule</h2>
      <div class="text-sm" id="schedule-info">
        <p class="text-gray-500 dark:text-gray-400">9:00 AM - 5:00 PM</p>
        <p class="text-xs text-gray-400 dark:text-gray-500">Mon, Tue, Wed, Thu, Fri</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-between items-center text-xs text-gray-500 dark:text-gray-400 mt-4">
      <button id="open-dashboard" class="hover:text-blue-600 dark:hover:text-blue-400">Open Dashboard</button>
      <button id="open-settings" class="hover:text-blue-600 dark:hover:text-blue-400">Settings</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
